apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
  namespace: regulated-services
  labels:
    app.kubernetes.io/name: patient-api
    app.kubernetes.io/part-of: clustershield360
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: patient-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patient-api
        app.kubernetes.io/part-of: clustershield360
        access-profile: internal-regulated
    spec:
      serviceAccountName: patient-api-sa
      automountServiceAccountToken: false
      containers:
        - name: patient-api
          # Pin to an approved internal or curated image in real environments.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: patient-api-config
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: patient-api-config
                  key: DATABASE_NAME
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: patient-api-config
                  key: API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
